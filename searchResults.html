<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Page</title>
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

</head>
<body class="bg-body-tertiary">

  <header class="py-4 border-bottom bg-dark">
    <div class="container">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center">
        <div>
          <h1 class="h3 text-white mb-0">Misafir at Ease</h1>
          <p class="text-white mb-0">Hotel reservation app</p>
        </div>
        <a href="index.html" class="btn btn-outline-secondary text-white text-bg-dark">Back to Home</a>
      </div>
    </div>
  </header>

  <main class="py-4">
    <div class="container">

      <!-- Search Bar -->
      <section class="mb-4">
        <div class="card rounded-4">
          <div class="card-body p-3 p-lg-4">
            <form id="searchForm" novalidate>
              <div class="row  align-items-end">
                <div class="col-12 col-lg-4">
                  <label for="searchText" class="form-label">Destination / Hotel</label>
                  <input
                    type="text"
                    id="searchText"
                    class="form-control form-control-lg"
                    placeholder="Antalya"
                    required
                  >
                </div>

                <div class="col-12 col-lg-2">
                  <label for="checkInDate" class="form-label">Check-in</label>
                  <input
                    type="date"
                    id="checkInDate"
                    class="form-control form-control-lg"
                    required
                  >
                </div>

                <div class="col-12 col-lg-2">
                  <label for="checkOutDate" class="form-label">Check-out</label>
                  <input
                    type="date"
                    id="checkOutDate"
                    class="form-control form-control-lg"
                    required
                  >
                </div>

                <div class="col-12 col-lg-2">
                  <label for="guestCount" class="form-label">Guests</label>
                  <select id="guestCount" class="form-select form-select-lg" required>
                    <option value="1">1 Guest</option>
                    <option value="2" selected>2 Guests</option>
                    <option value="3">3 Guests</option>
                    <option value="4">4 Guests</option>
                  </select>
                </div>

                <div class="col-6 col-lg-1 p-4 p-lg-0">
                  <label for="roomCount" class="form-label">Rooms</label>
                  <select id="roomCount" class="form-select form-select-lg" required>
                    <option value="1" selected>1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                  </select>
                </div>

                <div class="col-12 col-lg-1 d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">Search</button>
                </div>
              </div>

              <p id="searchError" class="text-danger small mb-0 mt-3"></p>
            </form>
          </div>
        </div>
      </section>

      <!-- Results -->
      <section>
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3">
          <div>
            <h2 class="h4 mb-1">Search Results</h2>
            <p id="resultsSummary" class="text-secondary mb-0"></p>
          </div>
        </div>

        <div id="resultsContainer" class="row g-4"></div>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/searchResults.js"></script>
</body>
</html>
