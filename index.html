<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Main Page</title>
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  
</head>

<body class="bg-tertiary">

  <header class="p-4 bg-dark">
    <div class="container">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
        <div>
          <h1 class="h3 text-white mb-0">Misafir at Ease</h1>
          <p class="text-white mb-0">Hotel reservation app</p>
        </div>
        <span class="badge text-bg-dark fw-semibold fs-6 px-3 py-2">Your comfort our responsibility</span>
      </div>
    </div>
  </header>

  <main class="py-3">
    <div class="container">

      <!-- Search Bar -->
      <section class="mb-4">
        <div class="card rounded-4">
          <div class="card-body p-3 p-lg-4">
            <form id="searchForm" novalidate>
              <div class="row  align-items-end">
                <div class="col-12 col-lg-4">
                  <label for="searchText" class="form-label">Destination / Hotel</label>
                  <input
                    type="text"
                    id="searchText"
                    class="form-control form-control-lg"
                    placeholder="Antalya"
                    required
                  >
                </div>

                <div class="col-12 col-lg-2">
                  <label for="checkInDate" class="form-label">Check-in</label>
                  <input
                    type="date"
                    id="checkInDate"
                    class="form-control form-control-lg"
                    required
                  >
                </div>

                <div class="col-12 col-lg-2">
                  <label for="checkOutDate" class="form-label">Check-out</label>
                  <input
                    type="date"
                    id="checkOutDate"
                    class="form-control form-control-lg"
                    required
                  >
                </div>

                <div class="col-12 col-lg-2">
                  <label for="guestCount" class="form-label">Guests</label>
                  <select id="guestCount" class="form-select form-select-lg" required>
                    <option value="1">1 Guest</option>
                    <option value="2" selected>2 Guests</option>
                    <option value="3">3 Guests</option>
                    <option value="4">4 Guests</option>
                  </select>
                </div>

                <div class="col-6 col-lg-1 p-4 p-lg-0">
                  <label for="roomCount" class="form-label">Rooms</label>
                  <select id="roomCount" class="form-select form-select-lg" required>
                    <option value="1" selected>1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                  </select>
                </div>

                <div class="col-12 col-lg-1 d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">Search</button>
                </div>
              </div>

              <p id="searchError" class="text-danger small mb-0 mt-3"></p>
            </form>
          </div>
        </div>
      </section>

      <!-- Dynamic Search Carousel -->
      <section id="searchCarouselSection" class="mb-5 d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 id="searchCarouselTitle" class="h4 mb-0"></h2>
          <a id="seeMoreDealsLink" href="searchResults.html" class="text-decoration-none">
            See more deals
          </a>
        </div>

        <div id="searchCarouselWrapper"></div>
      </section>

      <!-- Deals -->
      <section id="dealsSection" class="mb-5">

        <div class="h4 mb-3">
          <h2 class="h4 mb-1">Deals and Discounts</h2>
        </div>

        <div id="dealsContainer" class="row"></div>

      </section>

      <!-- Popular Searches -->
      <section class="mb-3 ">
        <h2 class="h4 mb-3">Popular Searches</h2>
        <div id="popularSearchCarouselWrapper"></div>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
