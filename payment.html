<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Page</title>
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-body-tertiary">

  <header class="py-4 border-bottom bg-dark">
    <div class="container">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
        <div>
          <h1 class="h3 text-white mb-0">Misafir at Ease</h1>
          <p class="text-white mb-0">Complete your booking</p>
        </div>
        <a href="hotelDetails.html" class="btn btn-outline-secondary text-white text-bg-dark">Back to Hotel</a>
      </div>
    </div>
  </header>

  <main class="py-4">
    <div class="container">
      <div class="row g-4">
        <div class="col-12 col-lg-4">
          <div id="bookingSummary"></div>
        </div>

        <div class="col-12 col-lg-8">
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
              <h2 class="h4 mb-4">Your Reservation Information</h2>

              <p id="paymentError" class="text-danger small mb-3"></p>

              <form id="paymentForm" novalidate>
                <div class="row g-3 mb-4">
                  <div class="col-12 col-md-6">
                    <label for="firstName" class="form-label fw-semibold">Your Name</label>
                    <input type="text" id="firstName" class="form-control" required>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="lastName" class="form-label fw-semibold">Your Surname</label>
                    <input type="text" id="lastName" class="form-control" required>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="email" class="form-label fw-semibold">Your Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="phone" class="form-label fw-semibold">Your Phone Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="+90 --- --- ----" required>
                  </div>
                </div>

                <h3 class="h5 mb-3">Payment Options</h3>

                <div class="card border-tertiary rounded-4">
                  <div class="card-body">
                      <label> <u> Pay via credit card </u> </label>

                    <div class="row g-3">
                      <div class="col-12">
                        <label for="cardHolder" class="form-label fw-semibold mt-1">Name on the card</label>
                        <input type="text" id="cardHolder" class="form-control" required>
                      </div>

                      <div class="col-12">
                        <label for="cardNumber" class="form-label fw-semibold">Card Number</label>
                        <input type="text" id="cardNumber" class="form-control" placeholder="xxxx xxxx xxxx xxxx" required>
                      </div>

                      <div class="col-12 col-md-6">
                        <label for="expiryDate" class="form-label fw-semibold">Expiration Date</label>
                        <input type="text" id="expiryDate" class="form-control" placeholder="MM/YY" required>
                      </div>

                      <div class="col-12 col-md-6">
                        <label for="cvv" class="form-label fw-semibold">Security Number</label>
                        <input type="text" id="cvv" class="form-control" placeholder="CVC" required>
                      </div>

                      <div class="col-12 d-grid d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-secondary btn-lg">
                          Complete the booking
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/payment.js"></script>
</body>
</html>
